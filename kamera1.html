<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>CAM 1</title>

<style>

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent;

}


/* =========================================
   VIDEO
========================================= */

#video {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: transparent;

    border: none;
    outline: none;

    display: block;

    opacity: 0;

    transition: opacity .15s linear;

}


/* =========================================
   VIDEO AKTIF
========================================= */

#video.active {

    opacity: 1;

}

</style>

</head>


<body>


<video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    disablepictureinpicture
    controlslist="nodownload noplaybackrate">
</video>


<script src="https://cdn.jsdelivr.net/gh/steveseguin/ninjasdk@latest/vdoninja-sdk.min.js"></script>


<script>

/* =========================================
   VDO.NINJA STREAM
========================================= */

const STREAM_ID = "seru17081945";


/* =========================================
   VIDEO ELEMENT
========================================= */

const video =
    document.getElementById("video");


/* =========================================
   SDK
========================================= */

let vdo = null;

let stream = null;


/* =========================================
   TAMPILKAN VIDEO
========================================= */

function showVideo() {

    video.classList.add("active");

}


/* =========================================
   SEMBUNYIKAN VIDEO
========================================= */

function hideVideo() {

    video.classList.remove("active");

}


/* =========================================
   PLAY
========================================= */

function playVideo() {

    if (!video.srcObject) {
        return;
    }

    video.play()
        .then(function() {

            showVideo();

        })
        .catch(function() {

            setTimeout(
                playVideo,
                300
            );

        });

}


/* =========================================
   TERIMA TRACK
========================================= */

function setupTrack() {

    vdo.addEventListener(
        "track",
        function(event) {

            if (!event.detail) {
                return;
            }


            const track =
                event.detail.track;


            if (!track) {
                return;
            }


            /*
                HANYA VIDEO
            */

            if (track.kind !== "video") {
                return;
            }


            console.log(
                "Video track diterima"
            );


            /*
                Buat MediaStream
            */

            stream =
                new MediaStream();


            stream.addTrack(track);


            /*
                Masukkan ke video
            */

            video.srcObject =
                stream;


            /*
                Tunggu frame
            */

            video.onloadeddata =
                function() {

                    playVideo();

                };


            video.oncanplay =
                function() {

                    playVideo();

                };


            /*
                Jika track berhenti
            */

            track.addEventListener(
                "ended",
                function() {

                    hideVideo();

                }
            );


            playVideo();

        }
    );

}


/* =========================================
   CONNECT
========================================= */

async function connect() {

    try {

        hideVideo();


        /*
            Buat SDK
        */

        vdo =
            new VDONinjaSDK({

                autoRecover: true,

                autoRelay: true

            });


        setupTrack();


        /*
            Connect
        */

        await vdo.connect();


        console.log(
            "VDO.Ninja connected"
        );


        /*
            View
        */

        await vdo.view(
            STREAM_ID,
            {

                audio: false,

                video: true

            }
        );


        console.log(
            "Request video:",
            STREAM_ID
        );


    }

    catch(error) {

        console.log(
            "Connection error:",
            error
        );


        hideVideo();


        /*
            Coba lagi
        */

        setTimeout(
            connect,
            2000
        );

    }

}


/* =========================================
   START
========================================= */

connect();

</script>

</body>

</html>
