<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>VDO.Ninja Video</title>

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
}

#remoteVideo {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: transparent;

    display: block;

    opacity: 0;

    transition: opacity 0.3s ease;
}

#remoteVideo.ready {
    opacity: 1;
}
</style>
</head>

<body>

<video
    id="remoteVideo"
    autoplay
    muted
    playsinline
    webkit-playsinline>
</video>

<script src="https://cdn.jsdelivr.net/gh/steveseguin/ninjasdk@latest/vdoninja-sdk.min.js"></script>

<script>

const STREAM_ID = "seru17081945";

const video = document.getElementById("remoteVideo");

let vdo = null;
let mediaStream = null;


/* =========================================
   MULAI VDO.NINJA
========================================= */

async function start() {

    try {

        console.log("Membuat VDO.Ninja SDK...");

        vdo = new VDONinjaSDK({
            autoRecover: true,
            autoRelay: true
        });


        console.log("Menghubungkan...");

        await vdo.connect();


        console.log("Connected");


        /* =====================================
           TERIMA TRACK
        ===================================== */

        vdo.addEventListener("track", function(event) {

            console.log("TRACK EVENT:", event);

            const detail = event.detail;

            if (!detail) {
                console.log("Tidak ada detail");
                return;
            }

            const track = detail.track;

            if (!track) {
                console.log("Tidak ada track");
                return;
            }

            console.log(
                "Track diterima:",
                track.kind
            );


            /* HANYA VIDEO */

            if (track.kind !== "video") {
                return;
            }


            /* Buat MediaStream */

            if (!mediaStream) {
                mediaStream = new MediaStream();
                video.srcObject = mediaStream;
            }


            /* Tambahkan video */

            if (!mediaStream.getVideoTracks().includes(track)) {

                mediaStream.addTrack(track);

                console.log(
                    "Video track ditambahkan"
                );

            }


            /* Putar */

            video.play()
                .then(() => {

                    video.classList.add("ready");

                    console.log(
                        "VIDEO BERHASIL DIPUTAR"
                    );

                })
                .catch(error => {

                    console.log(
                        "Play error:",
                        error
                    );

                });

        });


        /* =====================================
           MINTA STREAM
        ===================================== */

        console.log(
            "Meminta stream:",
            STREAM_ID
        );

        await vdo.view(
            STREAM_ID,
            {
                audio: false,
                video: true
            }
        );


        console.log(
            "View request berhasil"
        );

    }

    catch (error) {

        console.error(
            "VDO.Ninja ERROR:",
            error
        );

    }

}


/* =========================================
   VIDEO EVENT
========================================= */

video.addEventListener("playing", function() {

    console.log("Video playing");

    video.classList.add("ready");

});


video.addEventListener("loadeddata", function() {

    console.log("Video loaded");

});


video.addEventListener("error", function(error) {

    console.log(
        "Video error:",
        error
    );

});


/* =========================================
   START
========================================= */

start();

</script>

</body>
</html>
