<script src="https://cdn.jsdelivr.net/gh/steveseguin/ninjasdk@latest/vdoninja-sdk.min.js"></script>

<script>
const STREAM_ID = "seru17081945";

const video = document.getElementById("video");

const vdo = new VDONinjaSDK({
    autoRecover: true,
    autoRelay: true
});

vdo.addEventListener("track", function(event) {

    const track =
        event.detail &&
        event.detail.track;

    if (!track) return;

    if (track.kind !== "video") return;

    const stream = new MediaStream();

    stream.addTrack(track);

    video.srcObject = stream;

    video.play().then(function() {

        video.classList.add("show");

    }).catch(function(error) {

        console.log("PLAY ERROR:", error);

    });

});

async function start() {

    try {

        await vdo.connect();

        await vdo.view(
            STREAM_ID,
            {
                audio: false,
                video: true
            }
        );

        console.log("CAM 1 diminta");

    } catch(error) {

        console.log("VDO ERROR:", error);

    }

}

start();
</script>
