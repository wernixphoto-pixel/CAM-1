<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>CAM 1</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    display: block;
}
</style>
</head>

<body>

<video
    id="video"
    autoplay
    playsinline
    webkit-playsinline
    muted
></video>

<script src="https://cdn.jsdelivr.net/gh/steveseguin/ninjasdk@latest/vdoninja-sdk.min.js"></script>

<script>

const STREAM_ID = "seru17081945";

const video = document.getElementById("video");

let vdo = null;
let stream = null;


/* =========================================
   BUAT VIDEO STREAM
========================================= */

function setVideoTrack(track) {

    console.log("VIDEO TRACK:", track);

    if (!track) {
        console.log("Track kosong");
        return;
    }

    if (stream) {
        stream.getTracks().forEach(t => t.stop());
    }

    stream = new MediaStream();

    stream.addTrack(track);

    video.srcObject = stream;

    video.play()
        .then(() => {
            console.log("VIDEO BERHASIL PLAY");
        })
        .catch(error => {
            console.log("PLAY ERROR:", error);
        });

    track.onended = function() {

        console.log("VIDEO TRACK BERHENTI");

        setTimeout(connect, 2000);

    };

}


/* =========================================
   CONNECT VDO.NINJA
========================================= */

async function connect() {

    console.log("Menghubungkan VDO.Ninja...");

    try {

        if (vdo) {

            try {
                vdo.disconnect();
            } catch(e) {}

        }

        vdo = new VDONinjaSDK({

            autoRecover: true,
            autoRelay: true

        });


        /* =================================
           TERIMA TRACK
        ================================= */

        vdo.addEventListener("track", function(event) {

            console.log("EVENT TRACK:", event);

            if (!event.detail) {
                console.log("event.detail kosong");
                return;
            }

            const track = event.detail.track;

            if (!track) {
                console.log("track tidak ditemukan");
                return;
            }

            console.log(
                "TRACK KIND:",
                track.kind
            );

            if (track.kind === "video") {

                console.log(
                    "CAM 1 VIDEO DITERIMA"
                );

                setVideoTrack(track);

            }

        });


        /* =================================
           CONNECT
        ================================= */

        await vdo.connect();

        console.log(
            "VDO.Ninja CONNECTED"
        );


        /* =================================
           REQUEST CAM 1
        ================================= */

        await vdo.view(

            STREAM_ID,

            {
                video: true,
                audio: false
            }

        );

        console.log(
            "REQUEST CAM 1:",
            STREAM_ID
        );


    }

    catch(error) {

        console.log(
            "ERROR:",
            error
        );

        setTimeout(
            connect,
            3000
        );

    }

}


/* =========================================
   START
========================================= */

connect();

</script>

</body>
</html>
