<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>CAM 1 TEST</title>

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

}

#video {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

}

#status {

    position: fixed;

    left: 10px;
    top: 10px;

    z-index: 10;

    color: white;

    background: rgba(0,0,0,.7);

    padding: 8px 12px;

    font-family: Arial;

    font-size: 14px;

}

</style>

</head>


<body>


<div id="status">
MEMULAI...
</div>


<video
id="video"
autoplay
playsinline
webkit-playsinline
muted>
</video>


<script src="https://cdn.jsdelivr.net/gh/steveseguin/ninjasdk@latest/vdoninja-sdk.min.js"></script>


<script>

const STREAM_ID = "seru17081945";

const video =
document.getElementById("video");

const status =
document.getElementById("status");


function log(text) {

    console.log(text);

    status.innerText = text;

}


async function start() {

    try {

        log("Membuat VDO.Ninja...");


        const vdo =
        new VDONinjaSDK({

            autoRecover: true,
            autoRelay: true

        });


        log("CONNECT...");


        await vdo.connect();


        log("VDO.Ninja CONNECTED");


        /*
         =====================================
         REQUEST CAM
         =====================================
        */

        await vdo.view(

            STREAM_ID,

            {

                video: true,
                audio: false

            }

        );


        log(
            "MEMINTA CAM 1..."
        );


        /*
         =====================================
         TRACK
         =====================================
        */

        vdo.addEventListener(
            "track",
            function(event) {

                console.log(
                    "TRACK EVENT",
                    event
                );


                if (!event.detail) {

                    log(
                        "TRACK DETAIL KOSONG"
                    );

                    return;

                }


                const track =
                event.detail.track;


                if (!track) {

                    log(
                        "TRACK TIDAK ADA"
                    );

                    return;

                }


                log(
                    "TRACK: " +
                    track.kind
                );


                if (
                    track.kind ===
                    "video"
                ) {


                    const mediaStream =
                    new MediaStream();


                    mediaStream.addTrack(
                        track
                    );


                    video.srcObject =
                    mediaStream;


                    video.play()
                    .then(function() {

                        log(
                            "VIDEO BERHASIL"
                        );

                    })
                    .catch(function(error) {

                        log(
                            "PLAY ERROR"
                        );

                        console.log(
                            error
                        );

                    });

                }

            }
        );


    }

    catch(error) {

        log(
            "ERROR VDO.NINJA"
        );

        console.log(error);

    }

}


start();

</script>

</body>
</html>
