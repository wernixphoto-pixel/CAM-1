<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>CAM 1</title><style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
}

#ninja {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    opacity: 0;
    transition: opacity 0.5s ease;
    background: transparent;
}
</style></head><body><iframe
    id="ninja"
    src="https://vdo.ninja/?view=seru17081945"
    allow="autoplay; camera; microphone; fullscreen; display-capture"
    allowfullscreen>
</iframe><script>
const ninja = document.getElementById("ninja");

// VDO.Ninja mulai dimuat tetapi tetap transparan
ninja.style.opacity = "0";

// Setelah 8 detik, tampilkan VDO.Ninja
// dengan fade selama 0,5 detik
setTimeout(() => {
    ninja.style.opacity = "1";
}, 4000);
</script></body>
</html>
