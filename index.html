<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>CAM 1</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

/* ================================
   VIDEO VDO.NINJA
================================ */

#video {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    background: transparent;

    border: 0;
    outline: 0;

    opacity: 0;

    transition: opacity 0.2s ease;
}

/* ================================
   VIDEO AKTIF
================================ */

#video.active {
    opacity: 1;
}

</style>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    disablepictureinpicture>
</video>

<script src="https://cdn.jsdelivr.net/gh/steveseguin/ninjasdk@latest/vdoninja-sdk.min.js"></script>

<script>

/* =================================
   VDO.NINJA STREAM ID
================================= */

const STREAM_ID = "seru17081945";


/* =================================
   VIDEO
================================= */

const video = document.getElementById("video");


/* =================================
   VDO.NINJA SDK
================================= */

let vdo = null;
let currentStream = null;


/* =================================
   SHOW / HIDE
================================= */

function showVideo() {
    video.classList.add("active");
}

function hideVideo() {
    video.classList.remove("active");
}


/* =================================
   PLAY VIDEO
================================= */

function startPlayback() {

    if (!video.srcObject) {
        return;
    }

    const promise = video.play();

    if (promise !== undefined) {

        promise
        .then(() => {

            showVideo();

        })
        .catch(() => {

            setTimeout(
                startPlayback,
                500
            );

        });

    } else {

        showVideo();

    }
}


/* =================================
   TERIMA TRACK VDO.NINJA
================================= */

function setupTrackListener() {

    vdo.addEventListener(
        "track",
        function(event) {

            if (!event.detail) {
                return;
            }

            const track =
                event.detail.track;

            if (!track) {
                return;
            }


            /* Hanya video */

            if (track.kind !== "video") {
                return;
            }


            console.log(
                "CAM 1 video diterima"
            );


            /* Hentikan stream lama */

            if (currentStream) {

                currentStream
                    .getTracks()
                    .forEach(
                        track => track.stop()
                    );

            }


            /* Buat MediaStream baru */

            currentStream =
                new MediaStream();

            currentStream.addTrack(track);


            /* Masukkan ke video */

            video.srcObject =
                currentStream;


            /* =========================
               TRACK BERHENTI
            ========================= */

            track.addEventListener(
                "ended",
                function() {

                    console.log(
                        "CAM 1 terputus"
                    );

                    hideVideo();

                    setTimeout(
                        reconnect,
                        1000
                    );

                }
            );


            /* =========================
               TRACK MUTED
            ========================= */

            track.addEventListener(
                "mute",
                function() {

                    console.log(
                        "CAM 1 muted"
                    );

                }
            );


            /* =========================
               TRACK UNMUTED
            ========================= */

            track.addEventListener(
                "unmute",
                function() {

                    console.log(
                        "CAM 1 aktif kembali"
                    );

                    startPlayback();

                }
            );


            /* Tunggu video siap */

            video.onloadeddata =
                startPlayback;

            video.oncanplay =
                startPlayback;


            startPlayback();

        }
    );

}


/* =================================
   CONNECT VDO.NINJA
================================= */

async function connect() {

    try {

        hideVideo();


        console.log(
            "Menghubungkan VDO.Ninja..."
        );


        /* Buat SDK */

        vdo =
            new VDONinjaSDK({

                autoRecover: true,

                autoRelay: true

            });


        /* Listener */

        setupTrackListener();


        /* Connect */

        await vdo.connect();


        console.log(
            "VDO.Ninja connected"
        );


        /* Request CAM 1 */

        await vdo.view(
            STREAM_ID,
            {

                audio: false,

                video: true

            }
        );


        console.log(
            "CAM 1 requested:",
            STREAM_ID
        );

    }

    catch(error) {

        console.log(
            "VDO.Ninja error:",
            error
        );


        hideVideo();


        setTimeout(
            connect,
            3000
        );

    }

}


/* =================================
   RECONNECT
================================= */

function reconnect() {

    try {

        if (vdo) {

            vdo.disconnect();

        }

    }
    catch(error) {}


    vdo = null;

    currentStream = null;

    setTimeout(
        connect,
        1000
    );

}


/* =================================
   START
================================= */

connect();

</script>

</body>
</html>
