<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>CAM 1 - VDO.Ninja</title>


<style>

/* =========================================
   RESET
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================================
   HTML & BODY
========================================= */

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;

}


/* =========================================
   VIDEO
========================================= */

#video {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    border: none;
    outline: none;

    background: transparent;

    opacity: 0;

    transition:
        opacity 0.2s linear;

}


/* =========================================
   VIDEO AKTIF
========================================= */

#video.active {

    opacity: 1;

}

</style>

</head>


<body>


<!-- =======================================
     VIDEO VDO.NINJA
======================================== -->

<video

    id="video"

    autoplay
    muted
    playsinline
    webkit-playsinline

    disablepictureinpicture

    controlslist="
        nodownload
        noplaybackrate
        nofullscreen
    "

></video>



<!-- =======================================
     VDO.NINJA SDK
======================================== -->

<script src="https://cdn.jsdelivr.net/gh/steveseguin/ninjasdk@latest/vdoninja-sdk.min.js"></script>



<script>

/* =========================================
   VDO.NINJA STREAM ID
========================================= */

const STREAM_ID = "seru17081945";



/* =========================================
   VIDEO ELEMENT
========================================= */

const video =
    document.getElementById("video");



/* =========================================
   VARIABLE
========================================= */

let vdo = null;

let currentStream = null;

let reconnectTimer = null;



/* =========================================
   SHOW VIDEO
========================================= */

function showVideo() {

    video.classList.add("active");

}



/* =========================================
   HIDE VIDEO
========================================= */

function hideVideo() {

    video.classList.remove("active");

}



/* =========================================
   PLAY VIDEO
========================================= */

function playVideo() {

    if (!video.srcObject) {

        return;

    }


    const playPromise =
        video.play();


    if (playPromise !== undefined) {

        playPromise

        .then(function() {

            showVideo();

        })

        .catch(function() {

            setTimeout(

                playVideo,

                500

            );

        });

    }

}



/* =========================================
   BUAT MEDIA STREAM
========================================= */

function createVideoStream(track) {


    /* Hapus stream lama */

    if (currentStream) {

        currentStream
            .getTracks()
            .forEach(function(oldTrack) {

                oldTrack.stop();

            });

    }


    /* Buat MediaStream */

    currentStream =
        new MediaStream();


    currentStream.addTrack(track);


    /* Masukkan ke video */

    video.srcObject =
        currentStream;


    console.log(
        "Video track diterima"
    );


    /* =====================================
       VIDEO SIAP
    ===================================== */

    video.onloadeddata =
        function() {

            playVideo();

        };


    video.oncanplay =
        function() {

            playVideo();

        };


    video.onplaying =
        function() {

            showVideo();

        };


    /* =====================================
       TRACK BERHENTI
    ===================================== */

    track.addEventListener(
        "ended",
        function() {

            console.log(
                "Video track berhenti"
            );


            hideVideo();


            scheduleReconnect();

        }
    );


    /* =====================================
       TRACK MUTED
    ===================================== */

    track.addEventListener(
        "mute",
        function() {

            console.log(
                "Video track muted"
            );

        }
    );


    /* =====================================
       TRACK UNMUTED
    ===================================== */

    track.addEventListener(
        "unmute",
        function() {

            console.log(
                "Video track aktif kembali"
            );


            playVideo();

        }
    );


    /* =====================================
       PLAY
    ===================================== */

    playVideo();

}



/* =========================================
   SETUP TRACK
========================================= */

function setupTrack() {


    if (!vdo) {

        return;

    }


    vdo.addEventListener(
        "track",
        function(event) {


            if (!event.detail) {

                return;

            }


            const track =
                event.detail.track;


            if (!track) {

                return;

            }


            /* =================================
               HANYA VIDEO
            ================================= */

            if (track.kind !== "video") {

                return;

            }


            console.log(
                "CAM 1 diterima dari VDO.Ninja"
            );


            createVideoStream(
                track
            );

        }
    );

}



/* =========================================
   CONNECT
========================================= */

async function connect() {

    try {


        console.log(
            "Menghubungkan VDO.Ninja..."
        );


        hideVideo();


        /* =================================
           Hapus koneksi lama
        ================================= */

        if (vdo) {

            try {

                vdo.disconnect();

            }

            catch(error) {}

        }


        vdo = null;


        /* =================================
           BUAT SDK
        ================================= */

        vdo =
            new VDONinjaSDK({

                autoRecover: true,

                autoRelay: true

            });


        /* =================================
           TRACK LISTENER
        ================================= */

        setupTrack();


        /* =================================
           CONNECT
        ================================= */

        await vdo.connect();


        console.log(
            "VDO.Ninja connected"
        );


        /* =================================
           REQUEST VIDEO
        ================================= */

        await vdo.view(

            STREAM_ID,

            {

                audio: false,

                video: true

            }

        );


        console.log(
            "CAM 1 diminta:",
            STREAM_ID
        );


    }

    catch(error) {


        console.log(
            "Connection error:",
            error
        );


        hideVideo();


        scheduleReconnect();

    }

}



/* =========================================
   RECONNECT
========================================= */

function scheduleReconnect() {


    if (reconnectTimer) {

        return;

    }


    console.log(
        "Mencoba reconnect..."
    );


    reconnectTimer =
        setTimeout(

            function() {

                reconnectTimer = null;

                connect();

            },

            3000

        );

}



/* =========================================
   CEK VIDEO SECARA BERKALA
========================================= */

setInterval(

    function() {


        if (!video.srcObject) {

            return;

        }


        const tracks =
            video.srcObject.getVideoTracks();


        if (!tracks.length) {

            hideVideo();

            scheduleReconnect();

            return;

        }


        const track =
            tracks[0];


        if (track.readyState === "ended") {

            hideVideo();

            scheduleReconnect();

        }


    },

    3000

);



/* =========================================
   START
========================================= */

connect();

</script>


</body>

</html>
